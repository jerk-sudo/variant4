<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кафе «Айсель» — Меню</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Philosopher:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="menu-page">
    <header class="carpet-hero">
      <div class="carpet-hero__bg"></div>
      <div class="carpet-hero__medallion">
        <img src="assets/logo_aisel.png" alt="Айсель" class="carpet-hero__logo" />
        <p class="carpet-hero__text">Азербайджанська та українська гостинність</p>
      </div>
    </header>

    <nav class="heritage-nav">
      <div class="heritage-search">
        <input type="search" placeholder="Пошук страви у меню..." oninput="handleSearch(this.value)" />
      </div>
      <div class="cat-rail" id="categoryRail"></div>
    </nav>

    <main class="heritage-catalog" id="catalogContainer"></main>

    <footer class="heritage-footer">
      <img src="assets/logo_aisel.png" alt="Айсель" style="height:40px; margin-bottom:8px;" />
      <p>Натуральні продукти • Азербайджанська кухня • Незабутній смак</p>
    </footer>
  </div>

  <div class="modal-overlay" id="dishModal" onclick="closeDish(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeDish()">✕</button>
      <div class="modal-photo">
        <img id="modalImg" src="" alt="" />
      </div>
      <div class="modal-info">
        <div class="modal-cat" id="modalCategory"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price-row">
          <span class="modal-price" id="modalPrice"></span>
          <span class="modal-weight" id="modalWeight"></span>
        </div>
        <div class="modal-comp-wrap" id="modalCompWrap">
          <div class="modal-comp-label">Склад / Опис</div>
          <p class="modal-comp" id="modalComp"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
