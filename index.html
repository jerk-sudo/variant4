<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кафе «Айсель» — Меню</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="menu-page">
    <header class="hero-emerald">
      <div class="hero-emerald__brand">
        <img src="assets/logo_aisel.png" alt="Айсель" class="hero-emerald__logo" />
        <p class="hero-emerald__subtitle">Натуральні продукти • Азербайджанська кухня • Незабутній смак</p>
      </div>
      <div class="hero-emerald__photo-card">
        <img src="assets/hero_odyn_stil.jpg" alt="Страви кафе Айсель" />
      </div>
    </header>

    <main class="menu-body">
      <div class="menu-body__top">
        <h1 class="menu-heading">Наше меню</h1>
        <div class="search-box">
          <input type="search" placeholder="Пошук страви..." oninput="handleSearch(this.value)" />
        </div>
      </div>

      <nav class="cat-rail-wrap">
        <div class="cat-rail" id="categoryRail"></div>
      </nav>

      <div class="catalog-list" id="catalogContainer"></div>
    </main>

    <footer class="menu-footer">
      <img src="assets/logo_aisel.png" alt="Айсель" class="menu-footer__logo" />
      <p>Натуральні продукти • Азербайджанська кухня • Незабутній смак</p>
    </footer>
  </div>

  <div class="modal-overlay" id="dishModal" onclick="closeDish(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeDish()">✕</button>
      <div class="modal-photo">
        <img id="modalImg" src="" alt="" />
      </div>
      <div class="modal-info">
        <div class="modal-cat" id="modalCategory"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price-row">
          <span class="modal-price" id="modalPrice"></span>
          <span class="modal-weight" id="modalWeight"></span>
        </div>
        <div class="modal-comp-wrap" id="modalCompWrap">
          <div class="modal-comp-label">Склад / Опис</div>
          <p class="modal-comp" id="modalComp"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
